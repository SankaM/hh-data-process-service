plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.4'
	id 'io.spring.dependency-management' version '1.1.4'
	id 'com.palantir.docker' version '0.35.0'
	id 'com.palantir.docker-run' version '0.35.0'
}

group = 'com.mci'
version = '0.0.1'

java {
	sourceCompatibility = '17'
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web-services'
	implementation 'org.modelmapper:modelmapper:3.2.0'
	compileOnly 'org.projectlombok:lombok'
	implementation 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.named('bootJar') {
	launchScript()
}

jar {
	archiveFileName = 'data-process-service.jar'
	manifest {
		attributes(
				'Main-Class': 'com.hustlehub.dataservice.DataServiceApplication'
		)
	}
}

docker {
	name "${project.name}:${project.version}"
	dockerfile file('docker/Dockerfile')
	copySpec.from(jar).rename('.*', "data-process-service-0.0.1.jar")
	buildArgs(['JAR_FILE':"data-process-service-0.0.1.jar"])
	files 'data-process-service-0.0.1.jar'
	tag 'DockerHub', "kasunsk/hustlehub:${project.version}"
}

dockerRun {
	name "${project.name}"
	image "${project.name}:${project.version}"
	ports '8282:8282'
	clean true
}
